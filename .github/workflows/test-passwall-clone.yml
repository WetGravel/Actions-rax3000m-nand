name: 测试 passwall 克隆（新地址）

on:
  workflow_dispatch:   # 手动触发

jobs:
  debug-clone:
    runs-on: ubuntu-latest
    steps:
      - name: 检出基础源码（模拟构建环境，仅用于提供目录结构）
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt   # 根据你实际使用的源码调整
          path: openwrt
          ref: master

      - name: 准备 feeds 和 package 目录
        working-directory: openwrt
        run: |
          mkdir -p feeds/packages/lang
          mkdir -p feeds/luci/applications
          mkdir -p feeds/packages/net
          mkdir -p package

      - name: 执行修改后的克隆步骤
        working-directory: openwrt
        shell: bash
        run: |
          set -x

          # 安装 golang 1.23 使用 kenzok8 源
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/kenzok8/golang feeds/packages/lang/golang

          # 移除 immortalwrt 自带的 passwall 相关包
          rm -rf feeds/luci/applications/luci-app-passwall/
          rm -rf feeds/packages/net/xray-core/
          rm -rf feeds/packages/net/xray-plugin/

          echo "---------- 开始克隆 passwall (新地址) ----------"
          git clone --verbose https://github.com/openwrt-passwall/openwrt-passwall package/luci-app-passwall

          echo "---------- 开始克隆 passwall-packages (新地址) ----------"
          git clone --verbose https://github.com/openwrt-passwall/openwrt-passwall-packages package/luci-app-passwall-packages

          # 后续 feeds 安装（可能因缺少 feeds.conf 失败，只做参考）
          ./scripts/feeds install -a -f || echo "feeds install 失败，请确保 feeds.conf 已配置"
